[workspace]

[package]
name = "thanh-desktop"
version = "1.0.32"
description = "Chat-first ACP desktop client for Thanh"
authors = ["Thanh contributors"]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.77.2"

[lib]
name = "thanh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "thanh-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
base64 = "0.22"
dirs = "6"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.10", features = [] }
tauri-plugin-dialog = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
