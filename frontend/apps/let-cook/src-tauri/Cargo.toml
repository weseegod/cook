[workspace]

[package]
name = "let-cook"
version = "1.0.39"
description = "Chat-first ACP desktop client for Cook"
authors = ["Let Cook contributors"]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.77.2"

[lib]
name = "let_cook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "let-cook"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
base64 = "0.22"
dirs = "6"
fs2 = "0.4"
ignore = "0.4"
parking_lot = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
tauri = { version = "2.10", features = [] }
tauri-plugin-dialog = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2.11.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
